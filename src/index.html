<!DOCTYPE html>
<!--
index.html - page structure of the To-Do List

This file only defines the layout: the task form and an empty task list.
styles.css controls the appearance, and app.js fills in the list and
handles all user actions (add, edit, delete, mark complete).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page scale correctly on phones (needed for the responsive design) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <!--
        Task form: used for adding a new task, and reused for editing.
        In edit mode, app.js fills in the fields, changes the button text
        to "Save Changes" and shows the Cancel button.
        The ids are used by app.js to find each element.
        -->
        <form id="task-form">
            <!-- Required, so the browser blocks an empty title; app.js also rejects titles of only spaces -->
            <label>Title:
                <input type="text" id="task-title" maxlength="200" placeholder="What needs to be done?" required>
            </label>

            <label>Description:
                <textarea id="task-description" maxlength="500" placeholder="Optional details"></textarea>
            </label>
 
            <label>Priority:
                <select id="task-priority">
                    <option value="high">High</option> 
                    <option value="medium">Medium</option> 
                    <option value="low">Low</option>        
                </select>
            </label>

            <button type="submit" id="submit-button">Add Task</button>
            <!-- type="button" so it doesn't submit the form; hidden until editing -->
            <button type="button" id="cancel-button" hidden>Cancel</button>
        </form>

        <!-- The tasks are added here by app.js (one <li> per task) -->
        <ul id="task-list"></ul>

        <!-- Shown by app.js only when there are no tasks -->
        <p id="empty-message">No tasks yet. Add one above!</p>
    </main>

    <!--
    Scripts are loaded at the end of the body, so the elements above
    already exist when they run. tasks.js must load first, because
    app.js uses its functions.
    -->
    <script src="tasks.js"></script>
    <script src="app.js"></script>
</body>
</html>
